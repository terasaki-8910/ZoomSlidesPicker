[package]
name = "zoom-slides-picker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zoom_slides_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zoom-slides-picker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# In-app updates (docs/impl/updates.md): pinned with ~ to a release whose tauri requirement
# (2.12) the app's tauri already meets.
tauri-plugin-updater = "~2.13.3"

zsp-detect = { workspace = true }
zsp-output = { workspace = true }
zsp-capture = { workspace = true }
zsp-session = { workspace = true }
# The library window's zspthumb protocol encodes thumbnails as JPEG, on top of the
# workspace's own PNG-only default (docs/impl/library.md > zspthumb protocol).
image = { workspace = true, features = ["jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sys-locale = "0.3"
dirs = "6"
base64 = "0.22"
# Decodes the zspthumb:// request path (docs/impl/library.md), the same way tauri's own
# asset protocol decodes its request paths.
percent-encoding = "2"

# Turns off WebView2's browser shortcuts (Ctrl+J and the like) on Windows
# (docs/impl/library.md > Browser behaviour off in every window); tauri does not
# expose that setting.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = { workspace = true }
