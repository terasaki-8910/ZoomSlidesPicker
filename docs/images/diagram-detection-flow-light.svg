" data-to="scroll"><path class="data" d="M880 1100H1210V1152" marker-end="url(#arrow)"/><g class="edge-label" transform="translate(1210,1130)"><rect x="-57.1171875" y="-15.046875" width="114.234375" height="26"/><text text-anchor="middle">14. スクロール</text></g></g><g class="component" data-node="frame"><g class="icon-node" data-icon="tb:TbPhotoScan" transform="translate(222,162)" style="color:var(--capture)"><svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="56" width="56"><path d="M15 8h.01"/><path d="M6 13l2.644 -2.644a1.21 1.21 0 0 1 1.712 0l3.644 3.644"/><path d="M13 13l1.644 -1.644a1.21 1.21 0 0 1 1.712 0l1.644 1.644"/><path d="M3 7v-2a2 2 0 0 1 2 -2h2"/><path d="M3 17v2a2 2 0 0 0 2 2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M17 21h2a2 2 0 0 0 2 -2v-2"/></svg></g><text class="label" text-anchor="middle" x="250" y="248">フレームを解析</text><text class="sub" text-anchor="middle" x="250" y="271">幅 160 の輝度・細かさ</text></g><g class="component decision" data-node="blank"><path d="M700 135l130 55-130 55-130-55Z"/><text text-anchor="middle" x="700" y="196">単色の画面？</text></g><g class="component" data-node="motion"><g class="icon-node" data-icon="tb:TbFocus2" transform="translate(1122,162)" style="color:var(--core)"><svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="56" width="56"><path d="M11.5 12a.5 .5 0 1 0 1 0a.5 .5 0 1 0 -1 0" fill="currentColor"/><path d="M5 12a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M12 3l0 2"/><path d="M3 12l2 0"/><path d="M12 19l0 2"/><path d="M19 12l2 0"/></svg></g><text class="label" text-anchor="middle" x="1150" y="248">動く領域を比較から除外</text><text class="sub" text-anchor="middle" x="1150" y="271">動画・講師のカメラなど</text></g><g class="component" data-node="skip"><g class="icon-node" data-icon="tb:TbPlayerSkipForward" transform="translate(672,354)" style="color:var(--core)"><svg stroke="currentColor