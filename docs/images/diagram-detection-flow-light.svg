<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1390" viewBox="0 0 1440 1390" role="img" aria-labelledby="title desc" style="--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#707780;--border:#bcc3cb;--ui:#087ea4;--host:#087e91;--core:#ae4717;--capture:#aa5700;--files:#4b7228;--tools:#66513b">
<title id="title">スライド判定の流れ</title><desc id="desc">フレームを解析、単色の画面？、動く領域を比較から除外、保存しない、1 秒安定？、候補を保留・更新、確定できる？、保存済みの内容と比較、新しい 1 枚を保存、既存の 1 枚を置換、画像を増やさず記録、必要な位置だけ保存。解析画像、いいえ、はい、次のフレーム、本体を比較、いいえ / 次のフレーム、はい、一瞬で戻る状態を除外、いいえ / 待つ、はい、新規、追記など、同じ状態、スクロール。</desc>
<style>
