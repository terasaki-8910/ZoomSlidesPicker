<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ZSP-STAGE-SPIKE</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f4f4; color: #111;
    font-family: "Hiragino Sans", sans-serif; overflow: hidden; }
  .slide { position: absolute; inset: 40px; background: #fff; border: 2px solid #111;
    padding: 48px; box-sizing: border-box; }
  h1 { font-size: 56px; margin: 0 0 32px; }
  li { font-size: 36px; margin: 14px 0; visibility: hidden; }
  li.on { visibility: visible; }
  #video { position: absolute; right: 80px; bottom: 80px; width: 360px; height: 220px;
    background: #888; }
  #video.play { animation: move 0.5s linear infinite; }
  @keyframes move { 0% { background: #888; } 50% { background: #222; } 100% { background: #888; } }
</style>
</head>
<body>
<div class="slide" id="slide">
  <h1 id="title">Slide 1</h1>
  <ul id="items"></ul>
</div>
<div id="video"></div>
<script>
  // Scripted timeline (seconds from load). Used to check what the capture sees.
  const slides = {
    1: { title: 'Slide 1', items: ['項目 A', '項目 B', '項目 C'] },
    2: { title: 'Slide 2', items: ['項目 D', '項目 E'] },
    3: { title: 'Slide 3 (video)', items: ['項目 F'] },
    4: { title: 'Slide 4', items: ['項目 G'] },
  };
  const at = (s, fn) => setTimeout(fn, s * 1000);
  function show(n) {
    document.getElementById('title').textContent = slides[n].title;
    const ul = document.getElementById('items');
    ul.innerHTML = '';
    slides[n].items.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  }
  function reveal(i, delay) {
    at(delay, () => { const li = document.querySelectorAll('#items li')[i]; if (li) li.classList.add('on'); });
  }
  function slide(n, t, bullets) {
    at(t, () => { show(n); });
    bullets.forEach((d, i) => reveal(i, t + d));
  }
  slide(1, 0.0, [0.5, 1.0, 1.5]);
  slide(2, 6.0, [0.5, 1.0]);
  slide(3, 12.0, [0.5]);
  at(12.5, () => document.getElementById('video').classList.add('play'));  // video plays 12.5-22.5 s
  at(22.5, () => document.getElementById('video').classList.remove('play'));
  slide(1, 24.0, [0.5, 1.0, 1.5]);  // return to slide 1 (already shown)
  slide(4, 30.0, [0.5]);
</script>
</body>
</html>
